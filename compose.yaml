# docker compose up --build   ->  UI on http://localhost:8501, API on http://localhost:8010
# Requires a .env file (copy .env.example). Ollama keeps running on the host, not in Docker.
services:
  api:
    build: .
    image: rfp-copilot:latest
    env_file: .env
    environment:
      # Reach the host's Ollama (embeddings, or the LLM with the ollama profile).
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway" # needed on Linux; built in on Docker Desktop
    ports:
      - "8010:8010"
    volumes:
      - ./data/knowledge_base:/app/data/knowledge_base:ro
      - runs:/app/runs
      - chroma:/app/chroma_db
      - cache:/app/.cache

  ui:
    image: rfp-copilot:latest
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      RFP_API_URL: http://api:8010
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  runs:
  chroma:
  cache:
