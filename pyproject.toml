[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rfp-copilot"
version = "0.1.0"
description = "Multi-agent pipeline that drafts cited technical responses to RFPs, with a requirements compliance table."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM access: one OpenAI-compatible client for Gemini, Ollama and OpenAI
    "openai>=1.60,<3",
    "httpx>=0.27,<1",
    # Models and configuration
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # Orchestration (graph, interrupt, SQLite checkpointer)
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    # Retrieval
    "chromadb>=1.0,<2",
    "rank-bm25>=0.2.2,<0.3",
    # Persistence
    "sqlalchemy>=2.0,<3",
    # Documents
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    # API / UI
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "streamlit>=1.40,<2",
    # MCP server
    "mcp>=1.2,<2",
]

[project.scripts]
rfp-copilot = "rfp_copilot.cli:main"
rfp-copilot-mcp = "rfp_copilot.mcp_server.server:main"

[project.optional-dependencies]
tracing = ["langfuse>=3.0,<4"]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
