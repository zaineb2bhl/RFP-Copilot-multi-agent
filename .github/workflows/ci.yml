name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (offline, no API keys, no Ollama)
        env:
          LLM_PROVIDER: mock
          LLM_CACHE_ENABLED: "false"
        run: pytest

  docker:
    # Builds the image only (no container is run): checks the Dockerfile and lock file install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rfp-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
